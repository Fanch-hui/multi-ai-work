name: Validate desktop packages

on:
  workflow_dispatch:
    inputs:
      upload_run_id:
        description: Upload an existing successful run's release materials to the matching Release draft
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_NODE_VERSION: 22.23.2
  CI_PNPM_VERSION: 11.25.0

jobs:
  packages:
    if: ${{ inputs.upload_run_id == '' }}
    name: ${{ matrix.target }} package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
            flag: --mac
            app: release/mac-arm64/multi-AI work.app
          - os: windows-latest
            target: win-x64
            flag: --win
            app: release/win-unpacked
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated data and cache directories
        run: node scripts/ci/environment.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.CI_PNPM_VERSION }}
          run_install: false
      - name: Restore pnpm content store
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ env.CI_NODE_VERSION }}-pnpm-${{ env.CI_PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node-${{ env.CI_NODE_VERSION }}-pnpm-${{ env.CI_PNPM_VERSION }}-
      - name: Restore Electron download cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore package tool downloads
        id: builder-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            builder-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore verified Office runtime downloads
        id: office-cache
        uses: actions/cache/restore@v4
        with:
          path: workspace-runtime/downloads
          key: office-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/workspace-runtime/lock.json') }}
          restore-keys: |
            office-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Locate licensed runner VC Redist
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest -property installationPath
          if (!$installation) { throw 'Runner has no licensed Visual Studio VC Redist installation' }
          $crt = Get-ChildItem "$installation\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Licensed x64 app-local VC Redist directory was not found' }
          "MULTI_AI_OFFICE_CRT=$($crt.FullName)" >> $env:GITHUB_ENV
      - name: Verify target architecture
        run: node --input-type=module -e "if (process.platform + '-' + process.arch !== '${{ matrix.target == 'mac-arm64' && 'darwin-arm64' || 'win32-x64' }}') process.exit(1)"
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile --store-dir "${{ env.CI_PNPM_STORE }}"
      - name: Save pnpm content store
        if: ${{ always() && steps.install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CI_PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Prepare verified Office runtime
        id: office
        run: >-
          node scripts/workspace-runtime/prepare.mjs
          --target "${{ matrix.target }}"
          --crt-dir "${{ env.MULTI_AI_OFFICE_CRT }}"
      - name: Save verified Office runtime downloads
        if: ${{ always() && steps.office.outcome == 'success' && steps.office-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: workspace-runtime/downloads
          key: ${{ steps.office-cache.outputs.cache-primary-key }}
      - name: Build source
        run: pnpm build
      - name: Prepare application with target runtime and final dependency validation
        id: package
        run: node scripts/package.mjs ${{ matrix.flag }} --dir
      - name: Save Electron download cache
        if: ${{ always() && steps.package.outcome == 'success' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      - name: Validate copied package Core and Office conversion
        run: node scripts/package-smoke.mjs "${{ matrix.app }}" > release/package-smoke.json
      - name: Build installer from validated application
        id: installer
        run: pnpm exec electron-builder ${{ matrix.flag }} --prepackaged "${{ matrix.app }}" --publish never
      - name: Save package tool downloads
        if: ${{ always() && steps.installer.outcome == 'success' && steps.builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}
      - name: Record installer checksums
        run: node scripts/ci/package-checksums.mjs
      - name: Save installers and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/package-smoke.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  upload-release:
    name: Upload validated materials to Release draft
    if: ${{ inputs.upload_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Validate source run and unchanged production files
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.upload_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/release-source.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-source.json`, 'utf8'));
          assert.equal(run.conclusion, 'success');
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.path, '.github/workflows/package-validation.yml');
          assert.equal(run.head_branch, 'main');
          assert.match(run.head_sha, /^[0-9a-f]{40}$/);
          appendFileSync(process.env.GITHUB_ENV, `SOURCE_RUN_SHA=${run.head_sha}\n`);
          NODE
      - name: Check production source matches validated run
        run: git diff --exit-code "$SOURCE_RUN_SHA" HEAD -- . ':!tests/**' ':!.github/workflows/**' ':!README.md'
      - name: Download validated release materials
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-materials
          path: release
          run-id: ${{ inputs.upload_run_id }}
          github-token: ${{ github.token }}
      - name: Verify package bytes and generate update metadata
        run: node scripts/ci/release-metadata.mjs
      - name: Upload to matching Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/multi-AI-work-$version-arm64.dmg" \
            "release/multi-AI-work-$version-arm64.zip" \
            "release/multi-AI-work-$version-x64.exe" \
            release/latest.json release/SHA256SUMS.txt

  release-materials:
    name: Assemble update release materials
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Download validated platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Generate complete update manifest and checksums
        run: node scripts/ci/release-metadata.mjs
      - name: Save update release materials
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-materials
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
